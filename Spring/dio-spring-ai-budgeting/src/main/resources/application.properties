spring.application.name=budgeting-spring-ai

# --- OpenAI (defina a variavel de ambiente OPENAI_API_KEY) ---
# O valor padrao existe apenas para a aplicacao conseguir subir (e os testes rodarem) sem chave.
spring.ai.openai.api-key=${OPENAI_API_KEY:sem-chave-defina-OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.speech.options.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice=alloy
spring.ai.openai.audio.speech.options.response-format=mp3

# --- Banco de dados (H2 em memoria, sem precisar de Docker) ---
spring.datasource.url=jdbc:h2:mem:budgeting;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# --- Upload de audio ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Swagger UI em /swagger-ui.html ---
springdoc.swagger-ui.path=/swagger-ui.html
